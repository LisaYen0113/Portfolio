<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>聯絡方式 — 顏妤帆</title>
  <meta name="description" content="與顏妤帆聯絡：電子郵件與其他聯絡管道。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── tokens ─────────────────────────────────────────────────────────
       Six variables bound to brand-spec.md. No raw hex below this block. */
    :root {
      --bg:      #F1F6F8;
      --surface: #FFFFFF;
      --fg:      #33474E;
      --muted:   #5E7275;
      --border:  #DCE7EB;
      --accent:  #8A524D;

      --accent-soft: color-mix(in oklch, #DEBBB3 60%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-body:    'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --fs-h1: clamp(30px, 4.6vw, 50px);
      --fs-lead: 19px;
      --fs-body: 16px;
      --fs-meta: 13px;

      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;
      --container: 1120px;
      --gutter: 32px;

      --radius: 10px;
      --radius-lg: 14px;
    }

    /* ─── reset & base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 24px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.6;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2, h3 { text-wrap: balance; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    /* ─── layout primitives ─────────────────────────────────────────── */
    .container { max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }
    .section { padding-block: clamp(52px, 7vw, 88px); }
    .section + .section { border-top: 1px solid var(--border); }

    /* ─── type ──────────────────────────────────────────────────────── */
    .lead { font-size: var(--fs-lead); line-height: 1.7; color: var(--muted); max-width: 62ch; margin: 0; }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }

    /* ─── chrome: sidebar nav ───────────────────────────────────────── */
    .shell { display: grid; grid-template-columns: auto minmax(0, 1fr); min-height: 100vh; align-items: start; }
    .sidebar {
      position: sticky; top: 0; z-index: 20;
      width: 200px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; gap: var(--gap-lg);
      padding: 22px 16px;
      border-right: 1px solid var(--border);
      transition: width 0.22s ease, padding 0.22s ease;
    }
    .sidebar-head { display: flex; flex-direction: column; gap: 6px; }
    .sb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sidebar .logo { display: inline-flex; align-items: center; gap: 9px; min-width: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .sidebar .logo-name { white-space: nowrap; overflow: hidden; }
    .sidebar .logo-mark { display: none; width: 34px; height: 34px; place-items: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 15px; font-weight: 700; }
    .sidebar .meta { font-size: 12px; padding-left: 2px; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 10px;
      font-size: 14px; color: var(--muted);
      border: 1px solid transparent;
      transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .sidebar-nav a .ic { display: grid; place-items: center; width: 20px; height: 20px; flex: none; }
    .sidebar-nav a .ic svg { width: 19px; height: 19px; }
    .sidebar-nav a .lbl { white-space: nowrap; }
    .sidebar-nav a:hover { color: var(--fg); border-color: var(--border); }
    .sidebar-nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sidebar-nav a.is-active {
      color: var(--fg); font-weight: 600;
      background: var(--accent-soft);
      border-color: color-mix(in oklch, var(--accent) 28%, transparent);
    }
    /* ── collapse toggle (top-right of sidebar) ── */
    .sb-toggle {
      display: grid; place-items: center; flex: none;
      width: 32px; height: 32px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--surface); color: var(--muted);
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .sb-toggle:hover { color: var(--fg); border-color: var(--fg); }
    .sb-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sb-toggle svg { width: 16px; height: 16px; transition: transform 0.22s ease; }
    /* ── collapsed state ── */
    .shell.is-collapsed .sidebar { width: 60px; padding: 22px 10px; }
    .shell.is-collapsed .sidebar .logo,
    .shell.is-collapsed .sidebar .meta,
    .shell.is-collapsed .sidebar-nav a .lbl { display: none; }
    .shell.is-collapsed .sb-top { justify-content: center; }
    .shell.is-collapsed .sidebar-nav a { justify-content: center; padding: 10px 0; }
    .shell.is-collapsed .sb-toggle svg { transform: rotate(180deg); }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar {
        width: auto;
        height: auto; flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap;
        gap: var(--gap-sm) var(--gap-md); padding: 12px 20px;
        border-right: 0; border-bottom: 1px solid var(--border);
        background: color-mix(in oklch, var(--bg) 88%, transparent);
        backdrop-filter: blur(12px);
      }
      .sb-top { gap: 10px; }
      .sidebar-head { flex-direction: row; align-items: center; }
      .sidebar .meta { display: none; }
      .sidebar-nav { flex-direction: row; flex-wrap: wrap; gap: 4px; }
      .sidebar-nav a { padding: 8px 12px; gap: 8px; }
      .sidebar-nav a .ic { display: none; }
      .sb-toggle { display: none; }
      .shell.is-collapsed .sidebar { width: auto; padding: 12px 20px; }
      .shell.is-collapsed .sidebar .logo { display: inline-flex; }
      .shell.is-collapsed .sidebar-nav a .lbl { display: inline; }
      .shell.is-collapsed .sidebar-nav a { justify-content: flex-start; padding: 8px 12px; }
      html { scroll-padding-top: 88px; }
    }
    .pagefoot { padding-block: var(--gap-xl); color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
    .pagefoot .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); flex-wrap: wrap; }
    .pagefoot a:hover { color: var(--fg); }

    /* ─── buttons ───────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 15px; font-weight: 500; letter-spacing: -0.005em;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .btn-primary { background: var(--fg); color: var(--surface); border-color: var(--fg); }
    .btn-primary:hover { background: color-mix(in oklch, var(--fg) 84%, black); border-color: color-mix(in oklch, var(--fg) 84%, black); }
    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--fg); }

    /* ─── pill / tag ────────────────────────────────────────────────── */
    .pill {
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      padding: 5px 11px; background: var(--accent-soft); color: var(--accent);
      border-radius: 999px; font-family: var(--font-mono); font-size: 11px;
      font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    }

    /* ─── hero ──────────────────────────────────────────────────────── */
    .detail-hero { padding-top: clamp(40px, 6vw, 72px); }
    .detail-title { font-family: var(--font-display); font-size: var(--fs-h1); font-weight: 700; letter-spacing: -0.028em; line-height: 1.12; margin: 18px 0 0; max-width: 18ch; }
    .detail-lead { margin-top: 18px; }

    /* ─── contact ───────────────────────────────────────────────────── */
    .contact-row { display: flex; flex-wrap: wrap; gap: var(--gap-sm); margin-top: 4px; }
    .contact-list { list-style: none; margin: 0; padding: 0; }
    .contact-list li { display: flex; align-items: baseline; justify-content: space-between; gap: var(--gap-md); padding: 16px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .contact-list li:first-child { border-top: 1px solid var(--fg); }
    .contact-key { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--muted); }
    .contact-val { font-size: 15px; font-weight: 500; }
    .contact-val a:hover { color: var(--accent); }

    /* ─── reveal (respects reduced motion) ──────────────────────────── */
    @media (prefers-reduced-motion: no-preference) {
      .reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.6s ease, transform 0.6s ease; }
      .reveal.in { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell" id="top">
    <aside class="sidebar" data-od-id="sidebar">
      <div class="sidebar-head">
        <div class="sb-top">
          <a class="logo" href="index.html" aria-label="顏妤帆 — 作品集">
            <span class="logo-mark" aria-hidden="true">顏</span>
            <span class="logo-name">顏妤帆</span>
          </a>
          <button class="sb-toggle" type="button" aria-label="收合側邊欄" aria-expanded="true" aria-controls="sb-nav">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 6-6 6 6 6" /><path d="m19 6-6 6 6 6" /></svg>
          </button>
        </div>
        <span class="meta">Portfolio · 2026</span>
      </div>
      <nav class="sidebar-nav" id="sb-nav" aria-label="主導覽">
        <a href="index.html" title="首頁"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.2V20h13V9.2"/></svg></span><span class="lbl">首頁</span></a>
        <a href="about.html" title="個人介紹"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg></span><span class="lbl">個人介紹</span></a>
        <a href="portfolio.html" title="作品集"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2.2h8A1.5 1.5 0 0 1 20.5 9.7v7.8A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span><span class="lbl">作品集</span></a>
        <a href="experience.html" title="技能經歷"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 2.4 5.3 5.6.7-4.2 3.9 1.1 5.6L12 16.9 7.1 19l1.1-5.6-4.2-3.9 5.6-.7z"/></svg></span><span class="lbl">技能經歷</span></a>
        <a href="contact.html" class="is-active" title="聯絡方式"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></span><span class="lbl">聯絡方式</span></a>
      </nav>
    </aside>

    <div class="main-col">
      <main id="content">
    <!-- ── 聯絡方式 ───────────────────────────────────────────── -->

        <ul class="contact-list">
          <li>
            <span class="contact-key">EMAIL</span>

          <span class="meta"><a href="index.html">返回首頁 ↑</a></span>
        </div>
      </footer>
    </div>
  </div>

  <script>
    (function () {
      var reveals = document.querySelectorAll('.reveal');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if ('IntersectionObserver' in window && !reduce) {
        var rIO = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) { entry.target.classList.add('in'); rIO.unobserve(entry.target); }
          });
        }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
        reveals.forEach(function (el) { rIO.observe(el); });
      } else {
        reveals.forEach(function (el) { el.classList.add('in'); });
      }
    })();
  </script>

  <script>
    (function () {
      var shell = document.querySelector('.shell');
      var toggle = document.querySelector('.sb-toggle');
      if (!shell || !toggle) return;
      var KEY = 'sb-collapsed';
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      if (saved === '1') shell.classList.add('is-collapsed');

      function sync() {
        var collapsed = shell.classList.contains('is-collapsed');
        toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        toggle.setAttribute('aria-label', collapsed ? '展開側邊欄' : '收合側邊欄');
      }
      sync();
      toggle.addEventListener('click', function () {
        shell.classList.toggle('is-collapsed');
        try { localStorage.setItem(KEY, shell.classList.contains('is-collapsed') ? '1' : '0'); } catch (e) {}
        sync();
      });
    })();
  </script>
</body>
</html>
